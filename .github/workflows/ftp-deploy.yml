name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: 📦 Build Production Dependencies & Package
      run: |
        composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        zip -q -r vendor.zip vendor

    - name: ⚙️ Generate Environment File
      run: |
        echo 'APP_NAME="Amar Nath Hampers"' > .env
        echo 'APP_ENV=production' >> .env
        echo 'APP_KEY=base64:SEJ7DM56cXgrbJyYIgCNi6OQgjo1mGsGz3FLdhjENvY=' >> .env
        echo 'APP_DEBUG=true' >> .env
        echo 'APP_URL=https://amarnath-gift-hampers.ct.ws' >> .env
        echo 'ASSET_URL=/' >> .env
        echo 'DB_CONNECTION=mysql' >> .env
        echo 'DB_HOST=sql211.infinityfree.com' >> .env
        echo 'DB_PORT=3306' >> .env
        echo 'DB_DATABASE=if0_42433833_gift' >> .env
        echo 'DB_USERNAME=if0_42433833' >> .env
        echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/tests/**
          **/.github/**
          storage/framework/cache/data/**
          storage/framework/views/**
          storage/logs/**
          bootstrap/cache/*.php
          .phpunit*
          phpunit.xml
